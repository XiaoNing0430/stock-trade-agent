services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: stock_trade_agent
    ports:
      - "5433:5432"   # 宿主端口 5433（避免与本机已运行的 PostgreSQL 5432 冲突）
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6380:6379"   # 宿主端口 6380（避免与本机已运行的 Redis 6379 冲突）
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: stock_trade_agent
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ""
      REDIS_DB: 15
    ports:
      - "4173:4173"
    # 注意：不挂载 ./frontend/dist，镜像内已有 COPY --from=frontend-build 的产物。挂载会遮蔽镜像内构建。
    # 若需本地热替换构建产物，可临时取消注释以下行：
    # volumes:
    #   - ./frontend/dist:/app/frontend/dist:ro

volumes:
  pgdata:
